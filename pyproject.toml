[project]
name = "renversement"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "redel-byte", email = "ridouanelhabib1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fg-data-profiling>=4.20.0",
    "matplotlib>=3.5,<3.12",
    "missingno>=0.5.2",
    "numpy>=1.22,<2.6",
